<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chordbook</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#16222c;--mute:#5d6b77;--line:#d7dfe5;--acc:#17708f;--accbg:#e1f0f5}
@media(prefers-color-scheme:dark){:root{--bg:#10181e;--card:#17222a;--ink:#e6edf1;--mute:#93a3ae;--line:#26343e;--acc:#6cc0dc;--accbg:#1b3440}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:12px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.top a{margin-left:auto;color:var(--acc);font-size:.9rem}
.top small{color:var(--mute)}
input{display:block;width:100%;max-width:760px;margin:10px auto 8px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:760px;margin:0 auto}
.chips button{font:inherit;font-size:.85rem;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
main{max-width:760px;margin:0 auto;padding:10px 14px 40px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .n{font-weight:650}
summary .a{color:var(--mute);font-size:.9rem}
.tags{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.tag{font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.tag.od{background:var(--acc);color:var(--bg);font-weight:600}
.body{padding:2px 13px 14px;border-top:1px solid var(--line)}
.pick{margin:10px 0}
.dials{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.d{text-align:center;font-size:.8rem;color:var(--mute)}
.d b{display:block;color:var(--ink);font-size:.85rem;line-height:1.2}
.d svg{width:42px;height:42px;fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round}
.d.na{opacity:.4}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0;font-size:.92rem}
.meta dt{color:var(--mute)}.meta dd{margin:0}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch code{padding:3px 9px;border-radius:7px;border:1px solid var(--line);font:600 .95rem ui-monospace,Menlo,Consolas,monospace}
#none{color:var(--mute);text-align:center;margin-top:30px}
summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>

  <div class="top"><h1>Chordbook</h1><small id="count"></small><a id="back" href="../index.html">Back to recipebook</a></div>

  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<p id="none" hidden>No songs match.</p>

<script>
const S=JSON.parse(document.getElementById('songs').textContent);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sk=s=>s.t.replace(/^(the|a)\s+/i,'').toLowerCase();
S.sort((a,b)=>sk(a)<sk(b)?-1:1);
const dial=(l,v)=>{const n=(v.match(/\d+/g)||[]).map(Number),m=n.length?n.reduce((a,b)=>a+b)/n.length:null;
  return `<div class="d${m==null?' na':''}"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><line x1="20" y1="20" x2="20" y2="9" transform="rotate(${m==null?0:-135+m*27} 20 20)"/></svg><b>${esc(v)}</b>${l}</div>`};
const FILTERS=[['All',()=>1],['Clean',s=>s.od==='OFF'],['Overdrive',s=>/ON/.test(s.od)],['Capo',s=>s.capo!=='None'],['No capo',s=>s.capo==='None'],['Picking',s=>/Picking/.test(s.style)]];
let cur=0;
const list=document.getElementById('list');
list.innerHTML=S.map(s=>{
  const od=/ON/.test(s.od),meta=[['Style',s.style],['Tuning','Standard (E A D G B E)'],['Capo',s.capo],['Key',s.key],['Tempo',s.tempo],['Overdrive',s.od]].filter(r=>r[1]);
  const ch=s.chords?s.chords.split(', ').map(c=>`<code>${esc(c)}</code>`).join('')+(s.cnote?` <span class="a">${esc(s.cnote)}</span>`:''):'';
  return `<details><summary><span class="n">${esc(s.t)}</span><span class="a">${esc(s.a)}</span><span class="tags">${s.capo!=='None'?`<span class="tag">Capo ${esc(s.capo.replace(/ fret/,''))}</span>`:''}${od?'<span class="tag od">OD</span>':''}</span></summary>
  <div class="body"><p class="pick">${esc(s.pick)}</p>
  <div class="dials">${dial('Volume',s.vol)}${dial('Tone',s.tone)}${dial('Gain',s.gain)}${dial('Treble',s.tre)}${dial('Bass',s.bass)}</div>
  <dl class="meta">${meta.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
  ${ch?`<div class="ch">${ch}</div>`:''}</div></details>`}).join('');
const cards=[...list.children];
function apply(){const q=document.getElementById('q').value.trim().toLowerCase();let n=0;
  S.forEach((s,i)=>{const ok=FILTERS[cur][1](s)&&(s.t+' '+s.a).toLowerCase().includes(q);cards[i].hidden=!ok;n+=ok});
  document.getElementById('count').textContent=n+' of '+S.length;document.getElementById('none').hidden=n>0}
const chips=document.getElementById('chips');
chips.innerHTML=FILTERS.map((f,i)=>`<button aria-pressed="${i==0}" data-i="${i}">${f[0]}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c===b));apply()};
document.getElementById('q').oninput=apply;apply();
</script>
